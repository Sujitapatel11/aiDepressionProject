{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Journal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            background: #0f1419;
            color: #ffffff;
            font-family: system-ui, -apple-system;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            margin-bottom: 20px;
        }

        .entry {
            background: #1a1f2e;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 16px;
            border-left: 4px solid #9b59b6;
        }

        .date {
            font-size: 11px;
            opacity: 0.6;
            margin-bottom: 10px;
        }

        .content {
            font-size: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .empty {
            opacity: 0.6;
            font-size: 13px;
            text-align: center;
            padding: 40px;
        }

        .top-actions {
            margin-bottom: 20px;
        }

        .top-actions a {
            color: #9b59b6;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-actions">
        <a href="{% url 'journal_create' %}">+ Write new entry</a> |
        <a href="{% url 'dashboard' %}">Back to dashboard</a>
    </div>

    <h1>Your Journal</h1>

    {% if journals %}
        {% for entry in journals %}
            <div class="entry">
                <div class="date">{{ entry.created_at|date:"M d, Y • H:i" }}</div>
                <div class="content">{{ entry.content }}</div>
            </div>
        {% endfor %}
    {% else %}
        <div class="empty">
            No journal entries yet.
        </div>
    {% endif %}
</div>

</body>
</html>
