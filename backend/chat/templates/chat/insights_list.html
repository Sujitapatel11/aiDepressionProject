<!DOCTYPE html>
<html>
<head>
    <title>Your Insights</title>
</head>
<body>
<h2>Your Insights</h2>

{% for insight in insights %}
    <div style="padding:15px; margin-bottom:15px; border-radius:8px; background:#1a1f2e; color:white;">
        <h4>{{ insight.title }}</h4>
        <p>{{ insight.message }}</p>

        <form method="POST" action="{% url 'dismiss_insight' insight.id %}">
            {% csrf_token %}
            <button type="submit">Dismiss</button>
        </form>
    </div>
{% empty %}
    <p>No insights yet.</p>
{% endfor %}
</body>
</html>
