{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Friends</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: #f4f6fb;
    color: #333;
}

header {
    background: linear-gradient(135deg, #6a5acd, #9f7aea);
    color: white;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header a {
    color: white;
    text-decoration: none;
    font-size: 14px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 24px;
}

.intro h2 {
    margin-bottom: 6px;
}

.intro p {
    font-size: 14px;
    color: #555;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-top: 20px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.08);
}

/* Add friend */
.add-friend {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.add-friend input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    outline: none;
}

.add-friend button {
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: #6a5acd;
    color: white;
    cursor: pointer;
}

/* Friend list */
.friend {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
}

.friend:last-child {
    border-bottom: none;
}

.friend span {
    font-size: 14px;
}

.friend button {
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    background: #e6e8ff;
    color: #333;
    cursor: pointer;
}

.friend button:hover {
    background: #d9dcff;
}

.note {
    font-size: 12px;
    color: #777;
    margin-top: 10px;
}
</style>
</head>

<body>

<header>
    <div>👥 Friends</div>
    <a href="/dashboard/">Dashboard</a>
</header>

<div class="container">
    <div class="intro">
        <h2>Your connections</h2>
        <p>Human chat unlocks after adding a trusted friend.</p>
    </div>

    <div class="card">
        <div class="add-friend">
            <input id="friendInput" placeholder="Enter username">
            <button onclick="addFriend()">Add</button>
        </div>

        <div id="friendList"></div>

        <div class="note">
            Friends are private. No public discovery.
        </div>
    </div>
</div>

<script src="{% static 'chat/friends.js' %}"></script>
</body>
</html>
