{% load static %}
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Privacy & Settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: "Segoe UI", sans-serif;
    background: #f4f6fb;
    margin: 0;
}

header {
    background: #6a5acd;
    color: white;
    padding: 16px 24px;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 24px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 16px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.08);
}

.toggle {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
}

.toggle input {
    transform: scale(1.3);
}

.note {
    font-size: 13px;
    color: #666;
    margin-top: 12px;
}
</style>
</head>

<body>

<header>
    <h3>Privacy & Preferences</h3>
</header>

<div class="container">
    <div class="card">
        <h4>Anonymous Peer Suggestions</h4>

        <div class="toggle">
            <span>Allow anonymous peer recommendations</span>
            <input type="checkbox" id="optInToggle">
        </div>

        <div class="note">
            Recommendations are based on writing themes, not diagnosis.
            You will always choose whether to connect.
        </div>
    </div>
</div>

<script src="{% static 'chat/settings.js' %}"></script>
</body>
</html>
