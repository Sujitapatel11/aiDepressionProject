<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Log In — SoulCare</title>
  
  <!-- Premium Typography System: Plus Jakarta Sans (Headings) & Inter (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* ═════════════════════════════════════════════════════════════════
       SOULCARE TYPOGRAPHY SYSTEM & SAAS DESIGN TOKENS
       ═════════════════════════════════════════════════════════════════ */
    :root {
      /* Typography Tokens */
      --font-heading: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-body: 'Inter', system-ui, -apple-system, sans-serif;

      /* Core Dark SaaS Palette */
      --bg-surface: #090d16;
      --card-bg: rgba(18, 26, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-glow: rgba(99, 102, 241, 0.3);

      /* Primary Brand Tokens */
      --brand-primary: #6366f1;
      --brand-primary-hover: #4f46e5;
      --brand-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 50%, #4338ca 100%);
      --brand-glow: rgba(99, 102, 241, 0.25);

      /* Neutral Contrast Hierarchy */
      --text-heading: #f8fafc;
      --text-body: #cbd5e1;
      --text-muted: #64748b;
      --text-placeholder: #475569;

      /* Form Field Tokens */
      --input-bg: rgba(15, 23, 42, 0.6);
      --input-border: rgba(255, 255, 255, 0.1);
      --input-focus-border: #6366f1;
      --input-focus-glow: rgba(99, 102, 241, 0.2);

      /* Feedback Status Tokens */
      --error-bg: rgba(239, 68, 68, 0.12);
      --error-border: rgba(239, 68, 68, 0.25);
      --error-text: #fca5a5;

      /* Radii & Motion */
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --shadow-elevation: 0 24px 60px -12px rgba(0, 0, 0, 0.6), 0 0 40px rgba(99, 102, 241, 0.12);
      --transition-fast: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-surface);
      color: var(--text-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Glow Background Orbs */
    .ambient-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.45;
      animation: floatGlow 14s infinite alternate ease-in-out;
    }
    .glow-orb-1 { top: -120px; left: -100px; width: 450px; height: 450px; background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, rgba(99, 102, 241, 0) 70%); }
    .glow-orb-2 { bottom: -100px; right: -80px; width: 420px; height: 420px; background: radial-gradient(circle, rgba(20, 184, 166, 0.25) 0%, rgba(20, 184, 166, 0) 70%); animation-delay: -7s; }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 25px) scale(1.1); }
    }

    .bg-grid-overlay {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    /* Glassmorphism Card Container */
    .login-card {
      width: 100%;
      max-width: 430px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-xl);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-elevation);
      padding: 40px 32px 36px;
      z-index: 1;
      position: relative;
      animation: cardSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardSlideUp {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .header-section {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px var(--brand-glow);
      transition: transform var(--transition-fast);
    }
    .logo-badge:hover { transform: scale(1.06) rotate(3deg); }

    /* TYPOGRAPHY SCALE IMPLEMENTATION */
    .brand-title {
      font-family: var(--font-heading);
      font-size: 30px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.025em;
      color: var(--text-heading);
      margin-bottom: 6px;
    }

    .brand-tagline {
      font-family: var(--font-body);
      font-size: 14.5px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0.01em;
      color: var(--text-muted);
    }

    /* Error Alert Banner */
    .error-banner {
      display: none;
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 22px;
      align-items: center;
      gap: 12px;
      animation: bannerSlideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .error-banner.visible { display: flex; }

    @keyframes bannerSlideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Form Layout & Field Labels */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-label {
      font-family: var(--font-body);
      font-size: 10.5px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-body);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: color var(--transition-fast);
    }

    .form-input {
      width: 100%;
      height: 50px;
      padding: 0 46px 0 46px;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--text-heading);
      transition: all var(--transition-fast);
    }

    .form-input::placeholder { color: var(--text-placeholder); }

    .form-input:focus {
      outline: none;
      background-color: rgba(15, 23, 42, 0.85);
      border-color: var(--input-focus-border);
      box-shadow: 0 0 0 3.5px var(--input-focus-glow);
    }

    .form-input:focus ~ .input-icon,
    .input-wrapper:focus-within .input-icon { color: var(--brand-primary); }

    .toggle-password {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }
    .toggle-password:hover { color: var(--text-heading); background-color: rgba(255, 255, 255, 0.06); }

    .forgot-link-wrapper {
      display: flex;
      justify-content: flex-end;
      margin-top: -4px;
    }

    .forgot-link {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.5;
      color: var(--brand-primary);
      text-decoration: none;
      cursor: pointer;
      transition: color var(--transition-fast);
    }
    .forgot-link:hover { color: #818cf8; text-decoration: underline; }

    /* Button Typography Token */
    .btn-submit {
      width: 100%;
      height: 50px;
      background: var(--brand-gradient);
      color: var(--text-heading);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-md);
      font-family: var(--font-heading);
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 20px var(--brand-glow);
      transition: all var(--transition-fast);
      margin-top: 4px;
    }

    .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 8px 26px rgba(99, 102, 241, 0.35); }
    .btn-submit:active { transform: scale(0.985); }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: var(--text-heading);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-submit.loading .btn-text { display: none; }
    .btn-submit.loading .spinner { display: block; }

    /* Divider & Label Token */
    .divider-container {
      display: flex;
      align-items: center;
      margin: 24px 0;
      gap: 14px;
    }
    .divider-line { flex: 1; height: 1px; background-color: var(--input-border); }
    .divider-text {
      font-family: var(--font-body);
      font-size: 10.5px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-placeholder);
    }

    /* Google Sign In Button */
    .btn-google {
      width: 100%;
      height: 50px;
      background-color: rgba(255, 255, 255, 0.04);
      color: var(--text-heading);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      font-family: var(--font-heading);
      font-size: 14.5px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.01em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all var(--transition-fast);
    }
    .btn-google:hover { background-color: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.2); transform: translateY(-1px); }

    /* Footer Section */
    .footer-section {
      text-align: center;
      margin-top: 28px;
      font-family: var(--font-body);
      font-size: 13.5px;
      font-weight: 400;
      color: var(--text-muted);
    }
    .signup-link { font-weight: 600; color: var(--brand-primary); text-decoration: none; margin-left: 4px; transition: color var(--transition-fast); }
    .signup-link:hover { color: #818cf8; text-decoration: underline; }

    @media (max-width: 480px) {
      body { padding: 16px 12px; }
      .login-card { padding: 32px 20px 28px; }
      .brand-title { font-size: 26px; }
    }
  </style>
</head>
<body>

  <div class="ambient-glow glow-orb-1"></div>
  <div class="ambient-glow glow-orb-2"></div>
  <div class="bg-grid-overlay"></div>

  <main class="login-card" role="main">
    
    <header class="header-section">
      <div class="logo-badge" aria-label="SoulCare Logo">
        <svg width="34" height="34" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 6C20 6 24.5 13.5 24.5 18C24.5 20.4853 22.4853 22.5 20 22.5C17.5147 22.5 15.5 20.4853 15.5 18C15.5 13.5 20 6 20 6Z" fill="#6366f1" />
          <path d="M12.5 13.5C12.5 13.5 20 16 22 19.5C23.1046 21.433 22.433 23.9046 20.5 25C18.567 26.0954 16.0954 25.4234 15 23.4904C13.5 20.5 12.5 13.5 12.5 13.5Z" fill="#14b8a6" fill-opacity="0.85" />
          <path d="M27.5 13.5C27.5 13.5 20 16 18 19.5C16.8954 21.433 17.567 23.9046 19.5 25C21.433 26.0954 23.9046 25.4234 25 23.4904C26.5 20.5 27.5 13.5 27.5 13.5Z" fill="#38b2aa" fill-opacity="0.9" />
          <circle cx="20" cy="27" r="3.5" fill="#a5b4fc" />
        </svg>
      </div>
      <h1 class="brand-title">SoulCare</h1>
      <p class="brand-tagline">Welcome back. Please sign in to your sanctuary.</p>
    </header>

    <div class="error-banner" id="errorBanner" role="alert">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="errorMessage">Invalid credentials.</span>
    </div>

    <form class="login-form" id="loginForm" onsubmit="handleLoginSubmit(event)" novalidate>
      
      <div class="form-group">
        <label for="email" class="field-label">Email or Username</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="email" 
            name="username" 
            class="form-input" 
            placeholder="name@example.com" 
            required 
            autocomplete="username" 
          />
          <div class="input-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="field-label">Password</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-input" 
            placeholder="Enter your password" 
            required 
            autocomplete="current-password" 
          />
          <div class="input-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <button 
            type="button" 
            class="toggle-password" 
            id="togglePasswordBtn" 
            onclick="togglePasswordVisibility()" 
            aria-label="Show password"
          >
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="forgot-link-wrapper">
        <a class="forgot-link" onclick="handleForgotPassword()">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span class="btn-text">Sign In</span>
        <div class="spinner" id="btnSpinner"></div>
      </button>

    </form>

    <div class="divider-container" aria-hidden="true">
      <div class="divider-line"></div>
      <span class="divider-text">OR</span>
      <div class="divider-line"></div>
    </div>

    <button type="button" class="btn-google" onclick="handleGoogleSignIn()">
      <svg class="google-icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <footer class="footer-section">
      Don't have an account? 
      <a href="/" class="signup-link">Create Account</a>
    </footer>

  </main>

  <script>
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.getElementById('togglePasswordBtn');
      const eyeIcon = document.getElementById('eyeIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleBtn.setAttribute('aria-label', 'Hide password');
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        passwordInput.type = 'password';
        toggleBtn.setAttribute('aria-label', 'Show password');
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    }

    function showError(msg) {
      const banner = document.getElementById('errorBanner');
      const errorMsg = document.getElementById('errorMessage');
      errorMsg.textContent = msg;
      banner.classList.add('visible');
    }

    function hideError() {
      const banner = document.getElementById('errorBanner');
      banner.classList.remove('visible');
    }

    async function handleLoginSubmit(event) {
      event.preventDefault();
      hideError();

      const submitBtn = document.getElementById('submitBtn');
      const usernameInput = document.getElementById('email').value.trim();
      const passwordInput = document.getElementById('password').value;

      if (!usernameInput || !passwordInput) {
        showError('Please enter both email/username and password.');
        return;
      }

      submitBtn.classList.add('loading');
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/auth/login/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: usernameInput, password: passwordInput }),
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('soulcare_token', data.token);
          localStorage.setItem('soulcare_refresh', data.refresh);
          localStorage.setItem('soulcare_user_id', data.user_id);
          localStorage.setItem('soulcare_username', data.username);
          window.location.href = '/';
        } else {
          const detail = data.detail || (data.username ? data.username[0] : null) || 'Invalid credentials. Please try again.';
          showError(detail);
        }
      } catch (err) {
        showError('Network error. Please check your connection.');
      } finally {
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;
      }
    }

    async function handleForgotPassword() {
      hideError();
      const email = prompt('Enter your registered email address for password reset:');
      if (!email || !email.trim()) return;

      try {
        const res = await fetch('/api/auth/password/reset/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email.trim() })
        });
        const data = await res.json();
        alert(data.detail || 'Password reset link sent to your email address if registered.');
      } catch (e) {
        alert('Could not initiate password reset. Please try again.');
      }
    }

    function handleGoogleSignIn() {
      alert('Google Sign-In integration ready. Send OAuth ID token to /api/auth/google/');
    }
  </script>
</body>
</html>
