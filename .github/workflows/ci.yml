name: SoulCare CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**", "release/**"]

permissions:
  contents: read

concurrency:
  group: soulcare-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    name: Django checks and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soulcare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d soulcare_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: "False"
      SECRET_KEY: "ci-only-not-a-production-secret"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      CSRF_TRUSTED_ORIGINS: "http://localhost:5173"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/soulcare_test"
      REDIS_URL: "redis://localhost:6379"
      GOOGLE_CLIENT_ID: ""
      HF_API_KEY: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python manage.py check
        working-directory: backend
      - run: python manage.py test
        working-directory: backend
