name: Creator platform tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/creator-platform-backend]

jobs:
  creator-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Django system checks
        env:
          DEBUG: "True"
        run: python manage.py check
      - name: Check migration drift
        env:
          DEBUG: "True"
        run: python manage.py makemigrations creator --check --dry-run
      - name: Run creator platform tests
        env:
          DEBUG: "True"
        run: python manage.py test apps.creator --verbosity 2
